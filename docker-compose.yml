# Single-node production stack: app + PostgreSQL + HTTPS reverse proxy + daily database backup.
# Copy .env.example to .env, fill it in, then:  docker compose up -d --build
# The database password from .env reaches the containers only as a secret file (/run/secrets/db_password).
secrets:
  db_password:
    environment: POSTGRES_PASSWORD

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spamguard
      POSTGRES_USER: spamguard
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spamguard -d spamguard"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    image: spamguard-ai:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SPAMGUARD_ENV: production
      SPAMGUARD_TRUST_PROXY: "1"
      SPAMGUARD_PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      POSTGRES_HOST: db
      POSTGRES_DB: spamguard
      POSTGRES_USER: spamguard
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - spamguard_state:/var/lib/spamguard
    expose:
      - "8501"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: spamguard
      PGDATABASE: spamguard
    secrets:
      - db_password
    volumes:
      - db_backups:/backups
    # One pg_dump a day; dumps older than 7 days are removed. Expired rows are deleted by the app every hour.
    entrypoint: ["sh", "-c"]
    command:
      - |
        umask 077
        PGPASSWORD="$$(cat /run/secrets/db_password)"
        export PGPASSWORD
        while true; do
          file=/backups/spamguard_$$(date -u +%Y%m%d_%H%M%S).dump
          if pg_dump --format=custom --no-owner --file="$$file.part"; then mv "$$file.part" "$$file"; echo "backup: $$file"; else echo "backup failed" >&2; fi
          find /backups -name 'spamguard_*' -mtime +7 -delete
          sleep 86400
        done

volumes:
  postgres_data:
  db_backups:
  spamguard_state:
  caddy_data:
  caddy_config:
