name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Run tests
        run: python -m pytest tests -q --tb=short

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t spamguard-ai:ci .

      - name: Start container and wait for health
        run: |
          docker run -d --name spamguard -p 8501:8501 spamguard-ai:ci
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' spamguard)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker logs spamguard
          [ "$status" = "healthy" ]
          curl -fsS http://127.0.0.1:8501/_stcore/health

      - name: Model loads and classifies inside the image
        run: |
          docker exec spamguard python -c "from src.predict import predict_email; r = predict_email('Congratulations, you won a free prize. Claim now', 'svm'); print(r['label'], r['prob_spam']); assert r['assessable']"

      - name: Refuses to start with a weak cookie secret
        run: |
          ! docker run --rm -e GOOGLE_CLIENT_ID=x -e GOOGLE_CLIENT_SECRET=y -e SPAMGUARD_PUBLIC_URL=https://example.com -e SPAMGUARD_COOKIE_SECRET=short spamguard-ai:ci
