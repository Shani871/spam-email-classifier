name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spamguard
          POSTGRES_PASSWORD: spamguard
          POSTGRES_DB: spamguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spamguard -d spamguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Run tests (SQLite)
        run: python -m pytest tests -q --tb=short

      - name: Install PostgreSQL 17 client tools (same major version as the test server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Run tests (PostgreSQL)
        env:
          SPAMGUARD_TEST_DATABASE_URL: postgresql+psycopg://spamguard:spamguard@localhost:5432/spamguard_test
        run: |
          pg_dump --version
          python -m pytest tests -q --tb=short

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t spamguard-ai:ci .

      - name: Start container and wait for health
        run: |
          docker run -d --name spamguard -p 8501:8501 spamguard-ai:ci
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' spamguard)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker logs spamguard
          [ "$status" = "healthy" ]
          curl -fsS http://127.0.0.1:8501/_stcore/health

      - name: Model loads and classifies inside the image
        run: |
          docker exec spamguard python -c "from src.predict import predict_email; r = predict_email('Congratulations, you won a free prize. Claim now', 'svm'); print(r['label'], r['prob_spam']); assert r['assessable']"

      - name: Refuses to start with a weak cookie secret
        run: |
          ! docker run --rm -e GOOGLE_CLIENT_ID=x -e GOOGLE_CLIENT_SECRET=y -e SPAMGUARD_PUBLIC_URL=https://example.com -e SPAMGUARD_COOKIE_SECRET=short spamguard-ai:ci

      - name: Runs against PostgreSQL, migrates, stores and backs up data
        run: |
          docker network create spamguard-ci
          docker run -d --name pg --network spamguard-ci -e POSTGRES_USER=spamguard -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=spamguard postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U spamguard -d spamguard && break; sleep 2; done
          docker run -d --name app-pg --network spamguard-ci \
            -e SPAMGUARD_DATABASE_URL=postgresql+psycopg://spamguard:ci@pg:5432/spamguard spamguard-ai:ci
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app-pg)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker logs app-pg
          [ "$status" = "healthy" ]
          docker logs app-pg 2>&1 | grep -q "Database ready: postgresql+psycopg://spamguard:\*\*\*@pg"
          docker exec app-pg python -c "
          from src import user_storage
          with user_storage.user_scope('ci-user'):
              user_storage.add_history('High risk', 90, 'General message')
              assert len(user_storage.list_history()) == 1
          print(user_storage.account_row_counts())
          "
          docker exec pg psql -U spamguard -d spamguard -tAc "select version_num from alembic_version" | grep -q 0001
          docker exec pg pg_dump -U spamguard --format=custom --file=/tmp/ci.dump spamguard
          docker exec pg pg_restore --list /tmp/ci.dump | grep -q "TABLE public history"
